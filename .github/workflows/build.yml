name: Build

on:
  push:
    branches: [ master, maintenance-reboot-1x ]
  pull_request:
    branches: [ '**' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-gate:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Setup Windows SDK
      uses: GuillaumeFalourd/setup-windows10-sdk-action@v1.5
      with:
        sdk-version: 19041
    - name: Verify Windows SDK metadata
      shell: pwsh
      run: |
        $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
        $platformXml = Join-Path $programFilesX86 'Windows Kits\10\Platforms\UAP\10.0.19041.0\Platform.xml'
        if (-not (Test-Path -LiteralPath $platformXml)) {
          throw "Missing Windows SDK metadata file: $platformXml"
        }
    - name: Install dependencies
      run: dotnet restore ModernWpf.sln
    - name: Build
      run: dotnet build ModernWpf.sln --configuration Release --no-restore
    - name: Test theme resources
      run: dotnet test test\ModernWpf.Theme.Tests\ModernWpf.Theme.Tests.csproj --configuration Release --no-build
    - name: Test gallery metadata
      run: dotnet test test\ModernWpf.Gallery.Tests\ModernWpf.Gallery.Tests.csproj --configuration Release --no-build
    - name: Test WinUI layout and template parity
      run: dotnet test test\ModernWpf.WinUI.Tests\ModernWpf.WinUI.Tests.csproj --configuration Release --no-build --filter "LayoutCompatibility|LayoutPanel|TemplateParityTests|Repeater"
    - name: Pack
      run: dotnet pack ModernWpf.Controls\ModernWpf.Controls.csproj --configuration Release --no-build
    - name: Verify package
      shell: pwsh
      run: |
        $package = Get-ChildItem artifacts\ModernWpfUI.*.nupkg | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        .\tools\release\Verify-ModernWpfPackage.ps1 -PackagePath $package.FullName
    - name: Smoke test package
      shell: pwsh
      run: |
        $package = Get-ChildItem artifacts\ModernWpfUI.*.nupkg | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        .\tools\release\Test-ModernWpfPackageSmoke.ps1 -PackagePath $package.FullName
    - name: Publish
      if: success() && github.ref_name == 'master' && github.event.head_commit.message == 'Bump version'
      shell: pwsh
      run: |
        $package = Get-ChildItem artifacts\ModernWpfUI.*.nupkg | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        dotnet nuget push $package.FullName -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
