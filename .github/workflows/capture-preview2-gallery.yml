name: Capture Preview 2 Gallery

on:
  push:
    branches:
      - codex/preview2-adoption-release

permissions:
  contents: read

concurrency:
  group: preview2-gallery-capture-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Setup Windows SDK
      uses: GuillaumeFalourd/setup-windows10-sdk-action@v1.12
      with:
        sdk-version: 19041

    - name: Restore Gallery
      run: dotnet restore ModernWpf.Gallery\ModernWpf.Gallery.csproj

    - name: Build Gallery
      run: >-
        dotnet build ModernWpf.Gallery\ModernWpf.Gallery.csproj
        --configuration Debug --framework net8.0-windows7.0
        --no-restore --maxcpucount:1

    - name: Capture Light Gallery
      continue-on-error: true
      shell: pwsh
      run: >-
        .\tools\visual-checks\Run-WpfGalleryVisualAudit.ps1
        -Cases Home -Reference None -Theme Light
        -OutputRoot artifacts\preview2-gallery-capture\light
        -TimeoutSeconds 60

    - name: Capture Dark Gallery
      continue-on-error: true
      shell: pwsh
      run: >-
        .\tools\visual-checks\Run-WpfGalleryVisualAudit.ps1
        -Cases Home -Reference None -Theme Dark
        -OutputRoot artifacts\preview2-gallery-capture\dark
        -TimeoutSeconds 60

    - name: Stage verified screenshots
      if: always()
      shell: pwsh
      run: |
        $readyRoot = 'artifacts\preview2-gallery-ready'
        New-Item -ItemType Directory -Path $readyRoot -Force | Out-Null
        $captures = @(
          @{ Theme = 'Light'; Root = 'artifacts\preview2-gallery-capture\light' },
          @{ Theme = 'Dark'; Root = 'artifacts\preview2-gallery-capture\dark' }
        )
        foreach ($capture in $captures) {
          $report = Get-ChildItem -LiteralPath $capture.Root -Filter report.json -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $report) {
            throw "No $($capture.Theme) visual-audit report was produced."
          }

          $results = @(Get-Content -LiteralPath $report.FullName -Raw | ConvertFrom-Json)
          $modern = @($results | Where-Object {
            $_.App -eq 'ModernWpf' -and $_.Case -eq 'Home'
          })
          if ($modern.Count -ne 1 -or $modern[0].Status -ne 'Passed') {
            throw "$($capture.Theme) Gallery capture did not pass its visual-audit checks."
          }

          $screenshot = [string]$modern[0].Screenshot
          if (-not [IO.Path]::IsPathRooted($screenshot)) {
            $screenshot = Join-Path $PWD $screenshot
          }
          $file = Get-Item -LiteralPath $screenshot -ErrorAction Stop
          if ($file.Length -lt 10240) {
            throw "$($capture.Theme) Gallery screenshot is unexpectedly small: $($file.Length) bytes."
          }

          Copy-Item -LiteralPath $file.FullName `
            -Destination (Join-Path $readyRoot "Gallery.$($capture.Theme).png")
        }

    - name: Upload Gallery captures
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: preview2-gallery-captures
        path: |
          artifacts/preview2-gallery-capture
          artifacts/preview2-gallery-ready
        if-no-files-found: error
        retention-days: 7
