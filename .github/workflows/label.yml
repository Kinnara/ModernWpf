name: Label issues
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label_issues:
    runs-on: ubuntu-latest
    steps:
      - name: Label issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          gh issue edit "$ISSUE_NUMBER"
          --repo "${{ github.repository }}"
          --add-label "needs-triage"
